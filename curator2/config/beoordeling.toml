# Hoe items beoordeeld worden.
#
# Het taalmodel geeft geen cijfer, maar beantwoordt vaste vragen. Het programma
# telt daarna de punten hieronder op en houdt de beste items van de run.
# Pas gerust profiel, vragen of punten aan.

profiel = """
Kurt is een functionele ERP-consultant (Business Central, Dynamics 365 F&O, finance)
die kleine technische experimenten doet met Python en AI.
Interesse: AI-agents en workflows, Python-bibliotheken, DuckDB, RAG en kennisgrafen,
lokale LLM's, machine learning en deep learning, grafentheorie, AI-codeertools,
AI-productiviteitstools, PostgreSQL, statistiek, Obsidian en kennisbeheer.
Tools op de grens tussen functioneel en technisch zijn relevant: Microsoft Fabric,
Power BI, Databricks, Foundry en vergelijkbaar.
Niet relevant: zware tools voor grote ontwikkelteams (bijvoorbeeld Blitzy, Kubernetes-
operators, enterprise CI/CD), vakspecifieke tools voor andere sectoren (vastgoed, HR,
juridisch), pure consumenten-AI, frontend-frameworks, te basale inhoud ("wat is AI?").
"""

