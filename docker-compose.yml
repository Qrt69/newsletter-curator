services:
  web:
    build: .
    # Chromium (Playwright) needs more than Docker's default 64MB /dev/shm or it
    # crashes ("double free or corruption"), which hangs content extraction.
    shm_size: 1gb
    # PID 1 is "uv run reflex run", which does not reap children: killed or
    # crashed Chromium processes left permanent <defunct> slots behind. tini
    # reaps them.
    init: true
    # Backstop against runaway browser/pipeline leaks taking down the whole VPS
    # (a leak once reached 3000+ PIDs / 9.5 GB). On breach the container is
    # OOM-killed and restarted instead of the host swapping to death.
    # 6g, not 3g: the app idles at ~1.9GB of anonymous memory (Reflex starts 18
    # granian workers), so 3g left too little headroom for Chromium plus scoring
    # and would have OOM-killed a normal run. The VPS has 16GB; a runaway leak
    # once reached 9.5GB, so this still catches one.
    mem_limit: 6g
    pids_limit: 512
    ports:
      # Bind to loopback only: the app is reached through the host's Caddy
      # (newsletter-curator.higeja.tech). Publishing on 0.0.0.0 exposed the
      # unauthenticated /api/* endpoints directly on the public IP.
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      - DATA_DIR=/data
      - SCORER_BACKEND=local
      - LLM_BASE_URL=http://172.17.0.1:11234/v1
      - SKIP_BROWSER_LOGIN=1
      # No MALLOC_ARENA_MAX here on purpose. Capping glibc's arenas at 2 was
      # tried against the ~435MB a run leaves behind, but the lock contention
      # across extraction's 8 threads and dedup's 6 cost more speed than the
      # reclaimed memory was worth. The growth is bounded instead by starting
      # every run in a freshly restarted container -- see
      # scripts/nc-start-run.sh.
    volumes:
      - app-data:/data
    restart: unless-stopped

  scheduler:
    # Disabled by default: the weekly Sunday 18:00 UTC run only works when the
    # laptop is on with LM Studio reachable, and a successful run silently moves
    # emails to "Processed" without review. Start it explicitly when wanted:
    #   docker compose --profile scheduler up -d
    profiles: ["scheduler"]
    build: .
    # See web service for the reasoning behind these four.
    shm_size: 1gb
    init: true
    # 6g, not 3g: the app idles at ~1.9GB of anonymous memory (Reflex starts 18
    # granian workers), so 3g left too little headroom for Chromium plus scoring
    # and would have OOM-killed a normal run. The VPS has 16GB; a runaway leak
    # once reached 9.5GB, so this still catches one.
    mem_limit: 6g
    pids_limit: 512
    command: ["uv", "run", "python", "scripts/run_weekly.py", "--schedule"]
    env_file: .env
    environment:
      - DATA_DIR=/data
      - SCORER_BACKEND=local
      - LLM_BASE_URL=http://172.17.0.1:11234/v1
      - SKIP_BROWSER_LOGIN=1
    volumes:
      - app-data:/data
    restart: unless-stopped

volumes:
  app-data:
